# PostgreSQL (datos) y MinIO (fotos). El backend y el frontend se corren con npm en desarrollo.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo accesible desde tu propia computadora (no desde la red).
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Almacenamiento de archivos (fotos de daños), compatible con S3 y 100% local.
    # MinIO ya no publica imágenes en Docker Hub (desde oct. 2025); se usa la imagen gratuita de
    # Chainguard, que es MinIO compilado desde el código fuente oficial.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # API para el backend y consola web de administración: solo desde tu propia computadora.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
